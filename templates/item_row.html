<li id="item-{{ item.id }}">{% if item.photo_path %}<img class="photo" src="{{ url_for('static', filename=item.photo_path) }}" alt="Photo of {{ item.name }}">{% endif %}<strong>{{ item.name }}</strong> — {{ item.quantity }}{% if item.description %}<span>{{ item.description }}</span>{% endif %}<button hx-get="{{ url_for('edit_item', item_id=item.id) }}" hx-target="#item-{{ item.id }}" hx-swap="outerHTML">Edit</button><button hx-post="{{ url_for('delete_item', item_id=item.id) }}" hx-target="#item-list">Delete</button></li>
