<li id="item-{{ item.id }}">
  <form
    class="form compact"
    hx-post="{{ url_for('edit_item', item_id=item.id) }}"
    hx-target="#item-{{ item.id }}"
    hx-swap="outerHTML"
    enctype="multipart/form-data"
  >
    <label>Name <input name="name" value="{{ item.name }}" required></label>
    <label>Description <input name="description" value="{{ item.description }}"></label>
    <label>Quantity <input name="quantity" type="number" min="0" value="{{ item.quantity }}"></label>
    <label>
      Replace photo
      <input name="photo" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
    </label>
    <button>Save</button>
    <button
      type="button"
      hx-get="{{ url_for('cancel_edit', item_id=item.id) }}"
      hx-target="#item-{{ item.id }}"
      hx-swap="outerHTML"
    >
      Cancel
    </button>
  </form>
</li>
