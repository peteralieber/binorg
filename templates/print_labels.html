<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Bin labels</title><link rel="stylesheet" href="{{ url_for('static', filename='css/print.css') }}"></head><body>{% for bin in bins %}<article class="label"><img src="{{ url_for('static', filename=bin.qr_code_path) }}" alt="QR code"><h1>{{ bin.name }}</h1><p>{{ bin.description }}</p></article>{% endfor %}</body></html>
